<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Patients - LifeCare Hospital</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet"
      th:href="@{/css/patients.css}">

</head>
<!-- Java Script  -->
<script>

function saveOrUpdatePatient(){

    let id =
        document.getElementById("patientId").value;

    let patient = {

        name: document.getElementById("name").value,

        age: document.getElementById("age").value,

        gender: document.getElementById("gender").value,

        phone: document.getElementById("phone").value
    };

    let url="/patients";

    let method="POST";

    if(id){

        url="/patients/"+id;

        method="PUT";
    }

    fetch(url,{

        method:method,

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(patient)

    })

    .then(response=>response.json())

    .then(data=>{

        alert("Saved Successfully");

        document.getElementById("patientId").value="";

        loadPatients();

    });

}



</script>

<!--function body for display patient data -->
<script>

function loadPatients(){

    fetch("/patients")

    .then(response => response.json())

    .then(data => {

        let tableBody =
            document.getElementById("patientTableBody");

        tableBody.innerHTML = "";

        data.forEach((patient,index) => {

        	tableBody.innerHTML += `
        		<tr>

        		<td>${index + 1}</td>

        		    <td>${patient.name}</td>

        		    <td>${patient.age}</td>

        		    <td>${patient.gender}</td>

        		    <td>${patient.phone}</td>

        		<td>

        		<button class="btn btn-warning btn-sm"
        		onclick="editPatient(
        		'${patient.patientId}',
        		'${patient.name}',
        		'${patient.age}',
        		'${patient.gender}',
        		'${patient.phone}'
        		)">
        		Edit
        		</button>

        		<button class="btn btn-danger btn-sm"
        		onclick="deletePatient(${patient.patientId})">
        		Delete
        		</button>

        		</td>

        		</tr>
        		`;

        });

    });

}
window.onload = loadPatients;

<!-- load delete patient  -->
function deletePatient(id){

    if(!confirm("Delete this patient?")){
        return;
    }

    fetch(`/patients/${id}`, {

        method:"DELETE"

    })

    .then(response => response.text())

    .then(data => {

        alert("Patient Deleted");

        loadPatients();

    })

    .catch(error => {

        alert("Delete Failed");

    });

}


function editPatient(id,name,age,gender,phone){

    document.getElementById("patientId").value=id;

    document.getElementById("name").value=name;

    document.getElementById("age").value=age;

    document.getElementById("gender").value=gender;

    document.getElementById("phone").value=phone;

}






function searchPatient(){

    let input =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    let rows =
        document.querySelectorAll(
            "#patientTableBody tr"
        );

    rows.forEach(row => {

        let text =
            row.innerText.toLowerCase();

        row.style.display =
            text.includes(input)
            ? ""
            : "none";

    });

}



</script>

<body>

<div class="container mt-5">

    <div class="page-header">

        <h2>
            <i class="fas fa-users"></i>
            Patient Management
        </h2>

        <a href="/dashboard" class="btn btn-primary">
            Dashboard
        </a>

    </div>

    <!-- Patient Form -->

    <div class="card form-card">

        <div class="card-header">

            Add New Patient

        </div>

        <div class="card-body">

            <form>
            


                <div class="row">

                    <div class="col-md-6 mb-3">
                   <input type="hidden" id="patientId">
                        <label>Name</label>

                        <input type="text" id="name" class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Age</label>

                      <input type="number" id="age" class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Gender</label>

                       <select id="gender" class="form-control">

                            <option>Male</option>
                            <option>Female</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Phone</label>
<input type="text" id="phone" class="form-control">
                    </div>

                </div>
<button type="button"
class="btn btn-success"
onclick="saveOrUpdatePatient()">

Save / Update Patient

</button>
            </form>

        </div>

    </div>

    <!-- Patient Table -->

    <div class="card table-card mt-4">

        <div class="card-header">

            Patient List

        </div>

        <div class="card-body">
        <div class="mb-3">

    <input type="text"
           id="searchInput"
           class="form-control"
           placeholder="Search Patient..."
           onkeyup="searchPatient()">

</div>

            <table class="table table-hover">

                <thead 	>
<th>Action</th>
                    <tr>

    <th>ID</th>
    <th>Name</th>
    <th>Age</th>
    <th>Gender</th>
    <th>Phone</th>
    <th>Action</th>

               </tr>

                </thead>

               <tbody id="patientTableBody">
                  <!--     <tr>

                        <td>1</td>
                        <td>Rahul</td>
                        <td>25</td>
                        <td>Male</td>
                        <td>9876543210</td>

                    </tr> --> 

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
