<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Billing Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      th:href="@{/css/billing.css}">
      
      <link rel="stylesheet"
      th:href="@{/css/billing.css}">

</head>

<body>

<div class="container mt-5">

    <div class="page-header">

        <h2>💰 Billing Management</h2>

        <a href="/dashboard"
           class="btn btn-primary">

            Dashboard

        </a>

    </div>

    <div class="card form-card">

        <div class="card-header">

            Generate Bill

        </div>

        <div class="card-body">

           
                   
                   

            <div class="row">

                <div class="col-md-3">

                    <label>Patient</label>

                    <select id="patient"
                            class="form-control">

                        <option value="">
                            Select Patient
                        </option>

                    </select>

                </div>

                <div class="col-md-3">

                    <label>Consultation Fee</label>

                    <input type="number"
                           id="consultationFee"
                           class="form-control">

                </div>

                <div class="col-md-3">
                <input type="hidden" id="billId">

                    <label>Medicine Fee</label>

                    <input type="number"
                           id="medicineFee"
                           class="form-control">

                </div>
<div class="col-md-3">

    <label>Total Amount</label>

    <input type="number"
           id="totalAmount"
           class="form-control"
           readonly>

</div>
                <div class="col-md-3">

                    <label>Bill Date</label>

                    <input type="date"
                           id="billDate"
                           class="form-control">

                </div>

            </div>

            <br>

            <button
                class="btn btn-success"
                onclick="saveBill()">

                Generate Bill

            </button>

        </div>

    </div>

    <br>

    <input type="text"
           id="searchBill"
           class="form-control"
           placeholder="Search Bill...">

    <br>

    <div class="card table-card">

        <div class="card-header">

            Bill List

        </div>

        <div class="card-body">

            <table class="table table-hover">

                <thead>

                <tr>

               
                    <th>ID</th>
                    <th>Patient</th>
                    <th>Consultation</th>
                    <th>Medicine</th>
                    <th>Total</th>
                    <th>Date</th>
                    <th>Action</th>

                </tr>

                </thead>

                <tbody id="billTableBody">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="/js/billing.js"></script>

</body>
</html>
