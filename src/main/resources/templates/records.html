<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Medical Records</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      th:href="@{/css/records.css}">

</head>

<body>

<div class="container mt-5">

    <div class="page-header">

        <h2>📋 Medical Records</h2>

        <a href="/dashboard"
           class="btn btn-primary">

            Dashboard

        </a>

    </div>

    <div class="card form-card">

        <div class="card-header">
        

            Add Medical Record

        </div>

        <div class="card-body">

            <input type="hidden"
                   id="recordId">

            <div class="row">

                <div class="col-md-4">

                    <label>Patient</label>

                    <select id="patient"
                            class="form-control">

                    </select>

                </div>

                <div class="col-md-4">

                    <label>Visit Date</label>

                    <input type="date"
                           id="visitDate"
                           class="form-control">

                </div>

            </div>

            <br>

            <div class="row">

                <div class="col-md-4">

                    <label>Diagnosis</label>

                    <input type="text"
                           id="diagnosis"
                           class="form-control">

                </div>

                <div class="col-md-4">

                    <label>Treatment</label>

                    <input type="text"
                           id="treatment"
                           class="form-control">

                </div>

                <div class="col-md-4">

                    <label>Prescription</label>

                    <input type="text"
                           id="prescription"
                           class="form-control">

                </div>

            </div>

            <br>

            <button
                    class="btn btn-success"
                    onclick="saveRecord()">

                Save Record

            </button>

        </div>

    </div>

    <br>

    <input type="text"
           id="searchRecord"
           class="form-control"
           placeholder="Search Records..."
           onkeyup="searchRecord()">

    <br>

    <div class="card table-card">

        <div class="card-header">

            Medical Record List

        </div>

        <div class="card-body">

            <table class="table table-hover">

                <thead>

                <tr>

                    <th>Sr</th>
                    <th>Patient</th>
                    <th>Diagnosis</th>
                    <th>Treatment</th>
                    <th>Prescription</th>
                    <th>Date</th>
                    <th>Action</th>

                </tr>

                </thead>

                <tbody id="recordTableBody">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="/js/records.js"></script>

</body>
</html>
