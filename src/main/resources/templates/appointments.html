<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Appointment Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      th:href="@{/css/appointments.css}">

</head>

<body>

<div class="container mt-5">

    <div class="page-header">

        <h2>📅 Appointment Management</h2>

        <a href="/dashboard"
           class="btn btn-primary">

            Dashboard

        </a>

    </div>

    <div class="card form-card">

        <div class="card-header">

            Book Appointment

        </div>

        <div class="card-body">

            <input type="hidden"
                   id="appointmentId">

            <div class="row">

                <div class="col-md-4">

                    <label>Patient</label>

                    <select id="patient"
                            class="form-control">

                        <option value="">
                            Select Patient
                        </option>

                    </select>
                    <div class="col-md-4">


</div>	

                </div>

                <div class="col-md-4">
                
<label>Department</label>

<select
id="department"
class="form-control"
onchange="loadDoctorsByDepartment()">

</select>

                    

                </div>
                
                <div class="col-md-4">

<label>Doctor</label>

                    <select id="doctor"
                            class="form-control">

                        <option value="">
                            Select Doctor
                        </option>	

                    </select>
</div>
<div class="col-md-4">

    <label>Reason For Visit</label>

    <select
            id="reason"
            class="form-control">

        <option value="">
            Select Reason
        </option>

        <option value="Fever">
            Fever
        </option>

        <option value="Stomach Pain">
            Stomach Pain
        </option>

        <option value="Skin Allergy">
            Skin Allergy
        </option>

        <option value="Headache">
            Headache
        </option>

        <option value="Chest Pain">
            Chest Pain
        </option>

        <option value="Eye Problem">
            Eye Problem
        </option>

        <option value="Blood Pressure">
            Blood Pressure
        </option>

        <option value="Diabetes Checkup">
            Diabetes Checkup
        </option>

        <option value="Other">
            Other
        </option>

    </select>

</div>

                <div class="col-md-4">

                    <label>Date</label>

                    <input type="date"
                           id="appointmentDate"
                           class="form-control">

                </div>

            </div>

            <br>

            <button type="button"
                    class="btn btn-success"
                    onclick="saveAppointment()">

                Book Appointment

            </button>

        </div>

    </div>

    <br>

    <input type="text"
       id="searchAppointment"
       class="form-control"
       placeholder="Search Appointment..."
       onkeyup="searchAppointment()">

    <br>

    <div class="card table-card">

        <div class="card-header">

            Appointment List

        </div>

        <div class="card-body">

            <table class="table table-hover">

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Patient</th>
                    <th>Doctor</th>
                    <th>Reason</th> 	
                    <th>Date</th>
                    <th>Action</th>

                </tr>

                </thead>

                <tbody id="appointmentTableBody">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="/js/appointments.js"></script>

</body>
</html>
