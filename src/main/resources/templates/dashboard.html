<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>LifeCare Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" th:href="@{/css/style.css}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      th:href="@{/css/dashboard.css}">


</head>

<body class="dashboard-body">

<div class="container">

    <div class="text-center mt-5 mb-5">

        <h1 class="dashboard-title">
            🏥 LifeCare Hospital
        </h1>

        <p class="text-muted">
            Hospital Management Dashboard
        </p>

    </div>

    <div class="row g-4">

        <div class="col-md-4">
            <a href="/patients-page" class="dashboard-link">
                <div class="dashboard-card">
                    <i class="fas fa-users fa-3x"></i>
                    <h4>Patients</h4>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/doctors-page" class="dashboard-link">
                <div class="dashboard-card">
                    <i class="fas fa-user-doctor fa-3x"></i>
                    <h4>Doctors</h4>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/departments-page" class="dashboard-link">
                <div class="dashboard-card">
                    <i class="fas fa-building fa-3x"></i>
                    <h4>Departments</h4>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/appointments-page" class="dashboard-link">
                <div class="dashboard-card">
                    <i class="fas fa-calendar-check fa-3x"></i>
                    <h4>Appointments</h4>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/records-page" class="dashboard-link">
                <div class="dashboard-card">
                    <i class="fas fa-file-medical fa-3x"></i>
                    <h4>Records</h4>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/billing-page" class="dashboard-link">
                <div class="dashboard-card">
                    <i class="fas fa-file-invoice-dollar fa-3x"></i>
                    <h4>Billing</h4>
                </div>
            </a>
        </div>

    </div>

</div>

</body>
</html>
