<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<title>Doctor Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      th:href="@{/css/doctors.css}">

</head>

<body>

<div class="container mt-5">

    <div class="page-header">

        <h2>👨‍⚕️ Doctor Management</h2>

        <a href="/dashboard"
           class="btn btn-primary">

            Dashboard

        </a>

    </div>

    <!-- Doctor Form -->

    <div class="card form-card">

        <div class="card-header">
            Add Doctor
        </div>

        <div class="card-body">

            <input type="hidden" id="doctorId">

            <div class="row">

                <div class="col-md-4">

                    <label>Name</label>

                    <input type="text"
                           id="doctorName"
                           class="form-control">

                </div>

                <div class="col-md-4">

                    <label>Specialization</label>

                    <input type="text"
                           id="specialization"
                           class="form-control">

                </div>

                <div class="col-md-4">

                    <label>Department</label>

                    <select id="department"
                            class="form-control">

                        <option value="">
                            Select Department
                        </option>

                    </select>

                </div>

            </div>

            <br>

            <button
                type="button"
                class="btn btn-success"
                onclick="saveOrUpdateDoctor()">

                Save Doctor

            </button>

        </div>

    </div>

    <br>

    <!-- Search -->

    <input type="text"
           id="searchDoctor"
           class="form-control"
           placeholder="Search Doctor..."
           onkeyup="searchDoctor()">

    <br>

    <!-- Table -->

    <div class="card table-card">

        <div class="card-header">
            Doctor List
        </div>

        <div class="card-body">

            <table class="table table-hover">

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Specialization</th>
                    <th>Department</th>
                    <th>Action</th>

                </tr>

                </thead>

                <tbody id="doctorTableBody">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="/js/doctors.js"></script>

</body>
</html>
